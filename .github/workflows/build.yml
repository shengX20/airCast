name: Build APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0). If specified, directly creates a Release.'
        required: false
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APKs
        id: prep
        run: |
          mkdir -p release_apks
          TAG_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          fi
          
          IS_RELEASE="false"
          if [[ "$TAG_NAME" =~ ^v[0-9] ]] || [ -n "${{ github.event.inputs.version }}" ]; then
            IS_RELEASE="true"
          fi
          
          if [ "$IS_RELEASE" = "true" ]; then
            FILE_SUFFIX="${TAG_NAME}"
          else
            FILE_SUFFIX="latest"
          fi

          cp app/build/outputs/apk/release/app-release.apk "release_apks/AirCast-${FILE_SUFFIX}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release_apks/AirCast-${FILE_SUFFIX}-debug.apk"
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          ls -lh release_apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirCast-APKs
          path: release_apks/*

      - name: Publish GitHub Release
        if: steps.prep.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "AirCast ${{ steps.prep.outputs.tag_name }}"
          tag_name: ${{ steps.prep.outputs.tag_name }}
          files: |
            release_apks/AirCast-${{ steps.prep.outputs.tag_name }}.apk
            release_apks/AirCast-${{ steps.prep.outputs.tag_name }}-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false
