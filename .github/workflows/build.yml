name: Build APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APKs for Release
        run: |
          mkdir -p release_apks
          VERSION_TAG="${{ github.ref_name }}"
          if [ -z "$VERSION_TAG" ] || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" != "true" ]; then
            VERSION_TAG="latest"
          fi
          cp app/build/outputs/apk/release/app-release.apk "release_apks/AirCast-${VERSION_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release_apks/AirCast-${VERSION_TAG}-debug.apk"
          echo "Prepared APKs:"
          ls -lh release_apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirCast-APKs
          path: release_apks/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "AirCast ${{ github.ref_name }}"
          files: |
            release_apks/AirCast-${{ github.ref_name }}.apk
            release_apks/AirCast-${{ github.ref_name }}-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false
